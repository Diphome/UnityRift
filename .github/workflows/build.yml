name: UnityRiftBuild

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Download FBX SDK
        run: |
          md fbx
          cd fbx
          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_win.exe" -OutFile "fbxsdk.exe"
          Start-Process -FilePath "fbxsdk.exe" /S -Wait
          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_pdbs.exe" -OutFile "fbxpdb.exe"
          Start-Process -FilePath "fbxpdb.exe" /S -Wait
          cd ..

      - name: Locate FBX SDK
        shell: pwsh
        run: |
          $base = "C:\Program Files\Autodesk\FBX\FBX SDK"
          $sdk = Get-ChildItem $base -Directory -ErrorAction Stop |
                 Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw "No FBX SDK found under $base" }
          Write-Host "Using FBX SDK at $($sdk.FullName)"
          "FBXSDK_ROOT=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Nuget Restore
        run: nuget restore

      - name: Build .Net472
        run: msbuild /p:Configuration=Release /p:TargetFramework=net472 /verbosity:minimal

      - name: Build .Net8
        run: msbuild /t:UnityRiftGUI:publish /p:Configuration=Release /p:TargetFramework=net8.0-windows /p:SelfContained=false /verbosity:minimal

      - name: Build .Net9
        run: msbuild /t:UnityRiftGUI:publish /p:Configuration=Release /p:TargetFramework=net9.0-windows /p:SelfContained=false /verbosity:minimal

      - name: Publish CLI (portable, .Net8)
        run: msbuild /t:UnityRiftCLI:publish /p:Configuration=Release /p:TargetFramework=net8.0 /p:SelfContained=false /verbosity:minimal

      - name: Upload .Net472 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityRift.net472
          path: UnityRiftGUI/bin/Release/net472

      - name: Upload .Net8 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityRift.net8
          path: UnityRiftGUI/bin/Release/net8.0-windows/publish

      - name: Upload .Net9 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityRift.net9
          path: UnityRiftGUI/bin/Release/net9.0-windows/publish

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityRift.cli
          path: UnityRiftCLI/bin/Release/net8.0/publish
